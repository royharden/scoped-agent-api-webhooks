{% extends 'human_ui/base.html' %}{% block content %}
<h1>Approval confirmed</h1><p>This capability is bound to work order <code>{{ capability.order_id }}</code>, version {{ capability.resource_version }}, and your current human grant. Expires {{ capability.expires_at }}.</p><form method="post" action="{{ url_for('human_ui.approve',order_id=capability.order_id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="idempotency_key" value="{{ idempotency_key() }}"><input type="hidden" name="capability_id" value="{{ capability.capability_id }}"><input type="hidden" name="expected_version" value="{{ capability.resource_version }}"><button>Approve confirmed version</button></form><p><a href="{{ url_for('human_ui.detail',order_id=capability.order_id) }}">Return to work order</a></p>
{% endblock %}
